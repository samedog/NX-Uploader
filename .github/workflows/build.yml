name: build

on:
  push:
    branches: [ master, main ]
    tags: [ '*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Host tests
        run: |
          if command -v cc >/dev/null 2>&1; then
            make test
          else
            echo "no host compiler in the image, skipping tests"
          fi

      - name: Build NRO
        run: make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NXUploader
          path: NXUploader.nro

      - name: Attach NRO to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NXUploader.nro
