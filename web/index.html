<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NX Uploader</title>
<style>
:root{
  --bg:#0b0e13;
  --panel:#131820;
  --panel2:#1a212b;
  --border:#293342;
  --text:#e8edf3;
  --muted:#8995a5;
  --accent:#e60012;
  --accent2:#ff3948;
  --green:#35d07f;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#1a2029 0,#0b0e13 55%);
  color:var(--text);
  font-family:system-ui,"Segoe UI",Roboto,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px;
}
.wrap{
  width:100%;
  max-width:680px;
}
.header{
  text-align:center;
  margin-bottom:22px;
}
.logo{
  width:58px;
  height:58px;
  margin:0 auto 12px;
  border-radius:16px;
  background:linear-gradient(145deg,var(--accent2),var(--accent));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:800;
  box-shadow:0 10px 35px rgba(230,0,18,.25);
}
h1{
  margin:0;
  font-size:28px;
  letter-spacing:-.5px;
}
.subtitle{
  color:var(--muted);
  margin-top:6px;
  font-size:14px;
}
.card{
  background:rgba(19,24,32,.94);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.drop{
  border:2px dashed #354152;
  border-radius:14px;
  padding:34px 20px;
  text-align:center;
  cursor:pointer;
  transition:.18s ease;
  background:rgba(255,255,255,.015);
  display:block;
}
.drop:hover,.drop.drag{
  border-color:var(--accent2);
  background:rgba(230,0,18,.06);
  transform:translateY(-1px);
}
.icon{
  width:56px;
  height:56px;
  margin:0 auto;
  background:#0b0e13;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}
.arrow{
  position:relative;
  width:10px;
  height:15px;
  margin-bottom:2px;
}
.arrow-head{
  position:absolute;
  top:0;
  left:50%;
  width:8px;
  height:8px;
  border-left:3px solid white;
  border-top:3px solid white;
  transform:
    translateX(-50%)
    rotate(45deg);
}
.arrow-shaft{
  position:absolute;
  left:50%;
  bottom:0;
  width:3px;
  height:10px;
  background:white;
  transform:translateX(-50%);
  border-radius:2px;
}
.nx{
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial Black,Impact,sans-serif;
  font-size:20px;
  font-weight:900;
  line-height:1;
  letter-spacing:-2px;
}
.n{
  color:#e60012;
}
.x{
  color:#00a8e8;
}
.drop-icon{
  width:64px;
  height:64px;
  margin:0 auto 16px;
  border-radius:14px;
  background:#202833;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
}
.drop-title{
  font-size:17px;
  font-weight:650;
}
.drop-hint{
  margin-top:7px;
  color:var(--muted);
  font-size:13px;
}
#file{display:none}
.file-info{
  display:none;
  margin-top:14px;
  padding:12px 14px;
  border-radius:10px;
  background:var(--panel2);
  border:1px solid var(--border);
  font-size:14px;
}
.file-name{
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.file-size{
  color:var(--muted);
  margin-top:3px;
  font-size:12px;
}
button{
  width:100%;
  margin-top:16px;
  padding:13px 18px;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  color:white;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}
button:hover{filter:brightness(1.08)}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.progress-wrap{
  display:none;
  margin-top:20px;
}
.progress-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  font-size:13px;
}
.progress-label{color:var(--muted)}
#percent{font-weight:700}
.progress{
  height:10px;
  background:#252d38;
  border-radius:99px;
  overflow:hidden;
}
#bar{
  width:0%;
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .08s linear;
  box-shadow:0 0 15px rgba(255,57,72,.35);
}
#status{
  margin-top:14px;
  min-height:20px;
  text-align:center;
  font-size:13px;
  color:var(--muted);
  white-space: pre-line;
}
.success{color:var(--green)!important}
.error{color:#ff6571!important}
.footer{
  text-align:center;
  color:#626d7c;
  font-size:11px;
  margin-top:15px;
}
.badge{
  display:inline-block;
  padding:3px 7px;
  border-radius:5px;
  background:#202833;
  color:#9ca8b8;
  margin-top:5px;
}
@media(max-width:500px){
  body{padding:14px}
  .card{padding:16px}
  h1{font-size:24px}
}
.fm-bar{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}
.fm-btn{
  width:auto;
  margin:0;
  padding:7px 12px;
  font-size:13px;
  font-weight:600;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
}
.fm-btn:hover{ filter:brightness(1.15); }
.fm-btn:disabled{ opacity:.4; }
.fm-path{
  flex:1;
  min-width:0;
  padding:7px 11px;
  background:#0b0e13;
  border:1px solid var(--border);
  border-radius:8px;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:12.5px;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.fm-free{
  color:var(--muted);
  font-size:11.5px;
  white-space:nowrap;
  flex:0 0 auto;
}
.fm-table-wrap{
  max-height:420px;
  overflow:auto;
  border:1px solid var(--border);
  border-radius:10px;
  background:#0b0e13;
}
.fm-table{
  width:100%;
  border-collapse:collapse;
  font-size:13.5px;
}
.fm-table thead th{
  position:sticky;
  top:0;
  z-index:2;
  background:var(--panel2);
  text-align:left;
  font-weight:600;
  font-size:12px;
  color:var(--muted);
  padding:9px 12px;
  border-bottom:1px solid var(--border);
}
.fm-size-col{ width:90px; text-align:right; }
.fm-table tbody td{
  padding:8px 12px;
  border-bottom:1px solid #1c232d;
}
.fm-table tbody tr:last-child td{ border-bottom:0; }
.fm-table tbody tr.fm-row{ cursor:pointer; }
.fm-table tbody tr.fm-row:hover{ background:rgba(255,255,255,.03); }
.fm-name{
  display:flex;
  align-items:center;
  gap:9px;
  overflow:hidden;
}
.fm-name span{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.fm-ico{ flex:0 0 auto; opacity:.85; }
.fm-size{
  text-align:right;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
  font-size:12px;
}
.fm-empty,.fm-status{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  padding:18px;
}
.fm-status{ padding:10px 0 0; min-height:18px; }
.fm-status.error{ color:#ff6571; }
/* Row action buttons. All three share one fixed-size box so the glyph inside
   can never change a button's width. The pencil in particular gets picked up
   by a wide emoji font on some systems, which made that button look bigger. */
.fm-dl,
.fm-ren,
.fm-del{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width: 28px;
  height: 24px;
  margin: 0 4px 0 0;
  padding: 0;
  border: 1px solid #293342;
  border-radius: 6px;
  background: #141a24;
  color: #9fb0c4;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
  font-variant-emoji: text;
  text-decoration: none;
  cursor: pointer;
  opacity: 0;
  transition: opacity .12s, background .12s, color .12s;
}
.fm-row:hover .fm-dl,
.fm-row:hover .fm-ren,
.fm-row:hover .fm-del{ opacity: 1; }
.fm-dl{ border-color:#1e2a3a; background:#141a24; color:#7ab8ff; }
.fm-ren{ border-color:#2a2a3a; background:#16161f; color:#cfd6ff; }
.fm-del{ border-color:#3a2028; background:#1e1419; color:#ff8592; }
.fm-dl:hover{ background: #1a2333; color: #a8ceff; }
.fm-ren:hover{ background: #1c1c2a; color: #e6ebff; }
.fm-del:hover{ background: #2a1a20; color: #ffb0b8; }
@media (hover: none){
  .fm-dl, .fm-ren, .fm-del{ opacity: 1; }
}
.fm-new{
  flex: 0 0 auto;
}
.fm-act-col{ width: 124px; }
.drop-alt{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
  font-size:12.5px;
  color:var(--muted);
}
.drop-alt .link{ color:#7ab8ff; cursor:pointer; text-decoration:underline; }
.drop-alt .link:hover{ color:#a8ceff; }
.drop-opt{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; user-select:none; }
</style>
</head>

<body>
<div class="wrap">

<div class="header">
  <div class="icon">
    <div class="arrow"><div class="arrow-head"></div><div class="arrow-shaft"></div></div>
    <div class="nx"><span class="n">N</span><span class="x">X</span></div>
<div class="accent"></div>

</div>
  <h1>NX Uploader</h1>
  <div class="subtitle">Transfer files directly to your Nintendo Switch</div>
</div>

<div class="card">

  <div class="fm-bar">
    <button id="fmUp" class="fm-btn" type="button" title="Up one level">&#x2190; Back</button>
    <button id="fmRefresh" class="fm-btn" type="button" title="Refresh">&#8635;</button>
    <button id="fmNewFolder" class="fm-btn" type="button" title="New folder">New Folder</button>
    <div class="fm-path" id="fmPath">sdmc:/</div>
    <span class="fm-free" id="fmFree"></span>
  </div>

  <div class="fm-table-wrap">
    <table class="fm-table">
      <thead>
        <tr>
          <th>Name</th>
          <th class="fm-size-col">Size</th>
            <th class="fm-act-col"></th>
        </tr>
      </thead>
      <tbody id="fmBody">
        <tr><td colspan="3" class="fm-empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <div id="fmStatus" class="fm-status"></div>

  <form id="uploadForm">
    <label class="drop" id="drop">
      <div class="drop-title">Drop a file here to upload</div>
      <div class="drop-hint" id="dropHint">to sdmc:/</div>
      <input id="file" name="file" type="file" multiple>
    </label>

    <div class="drop-alt">
      <span id="pickFolder" class="link">or upload a whole folder</span>
      <label class="drop-opt"><input type="checkbox" id="toSwitch"> upload to sdmc:/switch instead</label>
    </div>
    <input id="folder" type="file" webkitdirectory directory multiple hidden>

    <div class="file-info" id="fileInfo">
      <div class="file-name" id="fileName"></div>
      <div class="file-size" id="fileSize"></div>
    </div>

    <button id="upload" type="submit" disabled>Upload to Switch</button>
  </form>

  <button id="cancel" type="button" style="display:none">Cancel upload</button>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-top">
      <span class="progress-label" id="progressLabel">Uploading...</span>
      <span id="percent">0%</span>
    </div>
    <div class="progress">
      <div id="bar"></div>
    </div>
  </div>

  <div id="status"></div>



</div>
<div class="footer">
NX Uploader
<br>
<span class="badge">Local network transfer</span>
</div>

</div>

<script>
let xhr = null;
let pickedFiles = null;
const form=document.getElementById('uploadForm');
const fileInput=document.getElementById('file');
const drop=document.getElementById('drop');
const fileInfo=document.getElementById('fileInfo');
const fileName=document.getElementById('fileName');
const fileSize=document.getElementById('fileSize');
const upload=document.getElementById('upload');
const progressWrap=document.getElementById('progressWrap');
const bar=document.getElementById('bar');
const percent=document.getElementById('percent');
const status=document.getElementById('status');
const progressLabel=document.getElementById('progressLabel');
const cancel=document.getElementById('cancel');
const fmNewFolder = document.getElementById('fmNewFolder');
const folderInput = document.getElementById('folder');
const pickFolder  = document.getElementById('pickFolder');
const toSwitch    = document.getElementById('toSwitch');
cancel.style.display='none';
cancel.onclick = function(){
  if (xhr) xhr.abort();
};
function formatBytes(n){
  if(n<1024)return n+' B';
  if(n<1024*1024)return (n/1024).toFixed(1)+' KB';
  if(n<1024*1024*1024)return (n/(1024*1024)).toFixed(1)+' MB';
  return (n/(1024*1024*1024)).toFixed(2)+' GB';
}

function selectFiles(files){
  if (!files || !files.length) return;

  if (files.length === 1){
    fileName.textContent = files[0].name;
    fileSize.textContent = formatBytes(files[0].size);
  } else {
    let total = 0;
    for (const f of files) total += f.size;
    fileName.textContent = files.length + ' files';
    fileSize.textContent = formatBytes(total);
  }
  fileInfo.style.display = 'block';
  upload.disabled = false;
  status.textContent = 'Ready to upload';
  status.className = '';
}

fileInput.addEventListener('change', function(){
  setPicked(this.files);
});

// Folder upload: the same input flow, but the file list comes from a
// directory picker (or a dropped folder) and each File carries a
// webkitRelativePath the server turns into subdirectories.
pickFolder.onclick = function(){ folderInput.click(); };
folderInput.addEventListener('change', function(){
  setPicked(this.files);
});

function setPicked(files){
  if (!files || !files.length) return;
  pickedFiles = files;
  selectFiles(files);
}

// Upload destination: the browsed folder, or sdmc:/switch when the install
// box is ticked.
function currentDestDir(){ return toSwitch.checked ? 'switch' : fm.cwd; }
function updateDropHint(){
  document.getElementById('dropHint').textContent = 'to sdmc:/' + currentDestDir();
}
toSwitch.addEventListener('change', updateDropHint);

drop.addEventListener('dragover',function(e){
  e.preventDefault();
  drop.classList.add('drag');
});

drop.addEventListener('dragleave',function(){
  drop.classList.remove('drag');
});

drop.addEventListener('drop',function(e){
  e.preventDefault();
  drop.classList.remove('drag');
  if (e.dataTransfer.files.length){
    setPicked(e.dataTransfer.files);
  }
});

fmNewFolder.onclick = async function(){
    const name = prompt('New folder name:');
    if (!name) return;

    // Reject the characters exFAT forbids, plus slashes.
    if (/[\\/:*?"<>|]/.test(name) || name === '.' || name === '..'){
        fmStatus.textContent = 'Invalid folder name.';
        fmStatus.className = 'fm-status error';
        return;
    }

    const rel = fm.cwd ? fm.cwd + '/' + name : name;

    try {
        const res = await fetch(window.location.href, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: 'MKDIR ' + rel,
        });
        if (!res.ok){
            const msg = await res.text();
            throw new Error(msg || ('HTTP ' + res.status));
        }
        fmStatus.textContent = '';
        fmStatus.className = 'fm-status';
        fm.load(fm.cwd);
    } catch (e){
        fmStatus.textContent = 'Could not create folder: ' + e.message;
        fmStatus.className = 'fm-status error';
    }
};

form.addEventListener('submit', async function(e){
  e.preventDefault();

  const files = (pickedFiles && pickedFiles.length) ? pickedFiles : fileInput.files;
  if (!files.length) return;

  const destDir = currentDestDir();
  const isFolder = Array.from(files).some(f => f.webkitRelativePath);

  // If any selected file already exists in the destination folder, confirm
  // before overwriting. A fresh listing is fetched so the check does not
  // rely on a stale view; if the fetch fails we just upload anyway. Folder
  // uploads skip this, since the listing only holds bare names.
  let names = null;
  if (!isFolder) try {
    const res = await fetch(window.location.href, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: 'LIST ' + destDir,
    });
    if (res.ok){
      names = new Set();
      for (const line of (await res.text()).split('\n')){
        const p = line.split('\t');
        if (p[1]) names.add(p[1].toLowerCase());
      }
    }
  } catch (err) { /* proceed without the check */ }

  if (names){
    const clashes = [];
    for (const f of files){
      if (names.has(f.name.toLowerCase())) clashes.push(f.name);
    }
    if (clashes.length){
      const verb = clashes.length === 1 ? 'it' : 'them';
      if (!confirm(clashes.length + ' file(s) already exist in this folder:\n\n' +
                   clashes.join('\n') + '\n\nOverwrite ' + verb + '?')){
        return;
      }
    }
  }

  const count = files.length;
  const label = count === 1 ? files[0].name : (count + ' files');

  upload.disabled=true;
  progressWrap.style.display='block';
  bar.style.width='0%';
  percent.textContent='0%';
  progressLabel.textContent='Uploading...';
  status.textContent = 'Sending ' + label + ' to the Switch...';
  status.className='';

  xhr = new XMLHttpRequest();
  cancel.style.display='block';
  const data=new FormData();
  for (const f of files) data.append('file', f, f.webkitRelativePath || f.name);

  xhr.upload.addEventListener('progress',function(e){
    if(e.lengthComputable){
      const p=Math.round((e.loaded/e.total)*100);
      bar.style.width=p+'%';
      percent.textContent=p+'%';
      progressLabel.textContent='Uploading... '+formatBytes(e.loaded)+' / '+formatBytes(e.total);
    }
  });

  xhr.addEventListener('load',function(){
    if(xhr.status>=200&&xhr.status<300){
      bar.style.width='100%';
      percent.textContent='100%';
      progressLabel.textContent='Upload complete';
      status.textContent = xhr.responseText.trim() || 'Upload complete.';
      status.className='success';
      fm.load(fm.cwd);
    }else{
      progressLabel.textContent='Upload failed';
      status.textContent='Server returned HTTP '+xhr.status;
      status.className='error';
    }
    upload.disabled=false;
    xhr = null;
    cancel.style.display='none';
  });

  xhr.addEventListener('error',function(){
    progressLabel.textContent='Connection error';
    status.textContent='Could not connect to the Switch.';
    status.className='error';
    upload.disabled=false;
    xhr = null;
    cancel.style.display='none';
  });

  xhr.addEventListener('abort',function(){
    progressLabel.textContent='Cancelled';
    status.textContent='Upload cancelled.';
    status.className='error';
    upload.disabled=false;
    xhr = null;
    cancel.style.display='none';
  });

  xhr.open('POST',window.location.href,true);
  xhr.setRequestHeader('X-Upload-Dir', destDir);
  xhr.send(data);
});

/* ---------- file manager ---------- */
const fm = {
  cwd: '',
  loaded: false,
  busy: false,
};

const fmBody    = document.getElementById('fmBody');
const fmPath    = document.getElementById('fmPath');
const fmStatus  = document.getElementById('fmStatus');
const fmUp      = document.getElementById('fmUp');
const fmRefresh = document.getElementById('fmRefresh');
const fmFree    = document.getElementById('fmFree');

async function refreshFree(){
  try {
    const res = await fetch(window.location.href, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: 'FREE',
    });
    if (!res.ok) return;
    const parts = (await res.text()).trim().split('\t');
    const fb = parseInt(parts[0], 10);
    const tb = parseInt(parts[1], 10);
    fmFree.textContent = (isFinite(fb) && fb >= 0)
      ? (formatBytes(fb) + ' free' + ((isFinite(tb) && tb > 0) ? ' / ' + formatBytes(tb) : ''))
      : '';
  } catch (e) {
    /* free space is best effort */
  }
}

fmRefresh.onclick = () => fm.load(fm.cwd);
fmUp.onclick      = () => fm.load(fm.cwd ? fm.cwd.replace(/\/?[^/]+$/, '') : '');

fm.load = async function(rel) {
  if (fm.busy) return;
  fm.busy = true;
  fmStatus.textContent = '';
  fmStatus.className = 'fm-status';
  fmBody.innerHTML = '<tr><td colspan="3" class="fm-empty">Loading…</td></tr>';

  try {
    const res = await fetch(window.location.href, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: 'LIST ' + rel,
    });
   

    if (!res.ok) {
      const msg = await res.text();
      throw new Error(msg || ('HTTP ' + res.status));
    }

    const text = await res.text();

    fm.cwd = rel;
    fm.loaded = true;
    fmPath.textContent = 'sdmc:/' + rel;
    updateDropHint();
    fmUp.disabled = (rel === '');

    const rows = text.split('\n').filter(Boolean);
    if (!rows.length) {
      fmBody.innerHTML = '<tr><td colspan="3" class="fm-empty">Empty folder</td></tr>';
      return;
    }
    rows.sort((a, b) => {
      const [ka, na] = a.split('\t');
      const [kb, nb] = b.split('\t');
      if (ka !== kb) return ka === 'D' ? -1 : 1;   // dirs first
      return na.localeCompare(nb, undefined, {sensitivity: 'base'});
    });
    fmBody.innerHTML = '';
    for (const line of rows) {
      const parts = line.split('\t');
      const kind = parts[0];
      const name = parts[1];
      const size = parseInt(parts[2], 10) || 0;
      if (!name) continue;

      const isDir = kind === 'D';

      const tr = document.createElement('tr');
      tr.className = 'fm-row';
      const dlHref = isDir ? '' :
        ('/dl?path=' + encodeURIComponent(fm.cwd ? fm.cwd + '/' + name : name));

      tr.innerHTML =
        '<td><div class="fm-name">' +
          '<span class="fm-ico">' + (isDir ? '&#128193;' : '&#128196;') + '</span>' +
          '<span></span>' +
        '</div></td>' +
        '<td class="fm-size">' + (isDir ? '' : formatBytes(size)) + '</td>' +
        '<td>' +
          (isDir ? '' :
            '<a class="fm-dl" href="' + dlHref + '" download title="Download">&#11015;&#xFE0E;</a>') +
          '<button class="fm-ren" type="button" title="Rename or move">&#9998;&#xFE0E;</button>' +
          '<button class="fm-del" type="button" title="Delete">&#10005;&#xFE0E;</button>' +
        '</td>';
      tr.querySelector('.fm-name span:last-child').textContent = name;

      const dlLink = tr.querySelector('.fm-dl');
      if (dlLink){
        // Stop the row's navigate handler from firing.
        dlLink.addEventListener('click', (e) => e.stopPropagation());
      }

      const renBtn = tr.querySelector('.fm-ren');
      renBtn.onclick = (e) => {
        e.stopPropagation();
        fm.rename(name, isDir);
      };

      const delBtn = tr.querySelector('.fm-del');
      delBtn.onclick = (e) => {
        e.stopPropagation();
        fm.delete(name, isDir);
      };

      if (isDir){
        tr.onclick = () => fm.load(fm.cwd ? fm.cwd + '/' + name : name);
      }

      fmBody.appendChild(tr);
    }

  } catch (e) {
    fmStatus.textContent = 'Could not list directory: ' + e.message;
    fmStatus.className = 'fm-status error';
    fmBody.innerHTML = '<tr><td colspan="3" class="fm-empty">—</td></tr>';
  } finally {
    fm.busy = false;
    refreshFree();
  }
};
fm.delete = async function(name, isDir){
    const rel = fm.cwd ? fm.cwd + '/' + name : name;
    const label = isDir ? 'folder' : 'file';
    if (!confirm('Delete ' + label + ' "' + name + '"?\n\nThis cannot be undone.'))
        return;

    try {
        const res = await fetch(window.location.href, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: 'DEL ' + rel,
        });
        if (!res.ok){
            const msg = await res.text();
            throw new Error(msg || ('HTTP ' + res.status));
        }
        fm.load(fm.cwd);
    } catch (e){
        fmStatus.textContent = 'Delete failed: ' + e.message;
        fmStatus.className = 'fm-status error';
    }
};
fm.rename = async function(name, isDir){
    const rel = fm.cwd ? fm.cwd + '/' + name : name;
    const to = prompt('Rename or move "' + name + '" to:', name);
    if (to === null) return;
    const trimmed = to.trim();
    if (!trimmed || trimmed === name) return;

    // A plain name stays in this folder; anything with a slash is treated as
    // a path relative to the root, so this doubles as a move.
    const newRel = (trimmed.indexOf('/') >= 0)
        ? trimmed
        : (fm.cwd ? fm.cwd + '/' + trimmed : trimmed);

    try {
        const res = await fetch(window.location.href, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: 'REN\t' + rel + '\t' + newRel,
        });
        if (!res.ok){
            const msg = await res.text();
            throw new Error(msg || ('HTTP ' + res.status));
        }
        fm.load(fm.cwd);
    } catch (e){
        fmStatus.textContent = 'Rename failed: ' + e.message;
        fmStatus.className = 'fm-status error';
    }
};
fm.load('');
</script>
